<!DOCTYPE html> 
<html lang="en">
<head>
<title>Form Example</title>
<meta charset="utf-8">
</head>
<body>
<style>
fieldset { width: 320px;
border: 2px ridge #ff0000;
padding: 10px; }
legend { font-family: Georgia, 'Times New Roman', serif;
            font-weight: bold;}
label { font-family: Arial, sans-serif; }
</style>
<h1>Contact Us</h1>
<form method="get">
    <fieldset>
<label> First Name: <input type="text" name="fname" id="fname"></label>
<br>
<br>
<label>Last Name: <input type="text" name="lname" id="lname"></label>
<br>
<br>
<label for="email">E-mail:</label>
<input type="email" name="email" id="email"><br>
<br>
</fieldset>
<label for="comments">Comments:</label><br>
<textarea name="comments" id="comments" rows="4" cols="40"></textarea><br><br>
<br>
<input type="submit" value="Contact Us"> <input type="reset">
</form>
</body>
</html>
